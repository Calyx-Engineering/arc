document: docs/report/issue-01-warning-light-dimming/README.md
lines: 1-41
why: >
  The case that isolates the framing preamble, because everything else about this opening is
  right. Section 1 is "Findings", its first sentence is the finding in bold, and the findings
  table is above the fold. Between the status header and that section sits one line —
  "Findings and conclusions. The derivations are in the companion notes listed in §6." — which
  tells the reader what the document is instead of what is true.
  It is the box #159 asks for, on a document nobody would otherwise call narrative: a preamble
  is a fail on its own, and this is the case that says so without a second defect confusing it.
  ITS FINDINGS TABLE IS UNSOURCED, and that is scored too — #164. Its right-hand column links a
  companion note per row, which is where the claim was worked out rather than where it came
  from. Two of those notes are `test-` and two are `analysis-` — measured against inferred, on
  adjacent rows of the same table, with nothing saying which is which. That is #164's defect on
  the document #159 uses as its clean-except-one-line case.
