why: >
  The provenance exemplar, and it is the user's own repair of the defect #164 names. Every row
  of the ledger carries where its claim came from, in its own column, and the document says why
  the column exists: three kill-path signals were carried on the demand list for weeks because
  nothing recorded that they came from a photograph of a board the project does not hold.
  It is the case that fixes what a pass looks like. Row-level provenance, in a column, on a
  table of claims that get built on.
  IT IS ALSO WHERE THE FIELD VOCABULARY LIVES. #266 reconciled this ledger's terms with the
  seven #164 specified: `firmware`, `drawing`, `report` and `thread` were adopted from these
  rows, and all four appear in the region. Under the seven-term vocabulary not one of them was
  a source the matcher could see, so the column verdict rested entirely on the header.
