lines: 217-262
why: >
  The conflict exemplar. The region starts at section 5, not at section 6, and that is
  deliberate: cut at the anomaly alone, the only `measured` token in it is the negated clause
  "budgets power by declared class, not by measured draw", so the verdict rested on an
  incidental word rather than on the measurement. Section 5 is where the measurement actually
  is — "Classification measurement — results", taken on the bench — and a conflict case that
  does not contain the measurement is not a conflict case.
  THE VERDICT IS STILL THINNER THAN IT LOOKS, and it is worth saying so: `measured` appears on
  both sides of the contrast split, so the direction survives the negated clause rather than
  being decided by the measurement alone. The column is coarse by construction — that is why
  only RESOLVED and SILENT are scored. A measured class 4 signature contradicts the vendor's own label, model
  suffix and silkscreen, all of which say 802.3af — and 802.3af does not permit class 4. The
  report resolves it in favour of the measurement and says so in the same sentence as the claim
  it is overriding: "all say 802.3af. But 802.3af defines classes 0-3 only."
  It also names the inference it is NOT treating as settled — "Most likely explanation: PROCET
  uses one PD front end across the family" — which is the half #164 says goes missing. A weak
  source that is labelled weak cannot silently win.
  Its consequences table is unsourced, and that is scored as well as the conflict: the same
  section can get the strong claim right and still hand a reader a table of numbers with no
  basis on it.
  LIMIT, RECORDED. #164's other instance — a bench measurement the user had verified, discounted
  in favour of an inference from a dead instrument — happened in conversation on 2026-08-28 and
  was never written into a document. This instrument grades documents, so that instance is a
  fixture in the selftest and not a case here. It is a real gap: the shape that cost the most is
  the shape with no artifact to score.
