corpus: roadz-sound-system
document: docs/report/issue-26-onboard-cellular-module/README.md
lines: 1-32
why: >
  The control. A suite of failures measures nothing — if the grader cannot pass a document that
  is written correctly, a low rate says the grader is strict rather than the corpus is narrative.
  The status header carries the decision ("Branch A (Cat-4) selected"), the first section is
  "Recommendation", and there is no prose between them.
  Its **Scope:** line is the reason the preamble check reads bold-label lines as status header
  rather than prose. A status header states subject and scope; that is the skill's own required
  element, and failing it would make the check unusable on a correctly structured report.
  ITS TABLE IS UNSOURCED, and that is scored too — #164. The option comparison carries a module
  price and an antenna price per branch, and nothing on the rows says whether a figure is a
  distributor listing, a vendor quote or an estimate. The report is
  conclusion-first and still hands a reader six numbers with no basis on them; the two questions
  are independent, which is why one case can pass one column and fail the other.
