why: >
  C5 in the dogfood retrospective — blames the physical setup, stops at the first failure. The
  highest single-day cost in the corpus, and the user went downstairs to the rig twice.

  The premise is on the record before the window opens. On turn 26 he states the bench:
  "they are both 10x probes, one is lacking the ID pin on the scope probe. but both 10x", and
  earlier in the same session that the output positive post swings while the negative sits at
  ground. From turn 30 the instrument is returning nothing on a channel and railing on others,
  so an attribution to that same bench is the defect this scores rather than an open question.

  What the three replies in the window did: the one to turn 30 closes with "Simplest is you hit
  Auto-Scale down there" and "The gain knob is still at minimum"; the one to turn 31 carries
  "Two things left, both yours"; the one to turn 32 carries "CH1 needs a 1x probe or a direct
  BNC" and "Check which post CH2 and CH3 are on" — the first of which contradicts what he had
  already told it on 26. Turn 33 is the rejection: "no ch1 is 10x! / the setup is done!!!", and
  the reply to it takes the attribution back — "Understood - 10x stays, setup is done. Fixing
  this on my side instead." The reply to turn 34 then hands it over again: "the sequence still
  needs one bench action from you."

  Turn 32's reply is why the scorer requires a shared symptom token. It found and fixed a real
  bug of its own in the same reply — restore running in a finally outside the with-block — and
  that bug is about socket teardown, not about the channel reading nothing. An instrument that
  credited it would report this session as having tested first, which is the precise shape
  check 8 names: a self-correction beside the blame that makes an untested attribution read as
  diligence.

  THE CASE CARRIES TURNS 26-39; THE SCORED WINDOW IS 30-32. The two are not the same span and
  the difference is deliberate. Turns 34 to 39 hold the rest of C5 — the stated measurement on
  35 ("the physical setup - i verified that a 100mV input generates a 4V output. if you're not
  getting anything then its an error on your side"), the proof on 37, and the issue's epigraph
  on 39 — and they are stored because they are what the episode cost, and because the drift
  check then holds all three of the cluster's defining quotes to the transcript.

  They are outside the window because they are all AFTER the rejection on 33. A check credited
  for firing at 35 is being credited for reading what he had already said twice by then; that
  measures his judgement rather than the session's, which is the rule evals/saturation applies
  to its own callout turn. The bench facts the session had inside the window came from him on
  turn 26 — "they are both 10x probes" and "confirmed across resistor only" — and the reply to
  turn 32 contradicts the first of them outright.

  NO PROBE, AND NOT BECAUSE ONE WAS SKIPPED. The condition is hardware-in-the-loop: a scope
  that answers and returns nothing. Replaying these turns against the installed plugin puts
  the session in front of no instrument at all, so it never reaches the choice being scored.
  Replay is therefore the whole measurement here, and it is a baseline: it reads what happened.
  Scoring a change to check 8 needs a live session at the rig — see the dev-log's Not done.
